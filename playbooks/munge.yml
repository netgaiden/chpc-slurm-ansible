---
- name: Configure Munge authentication
  hosts: cluster
  tasks:
    - name: Enable and start munge service
      systemd:
        name: munge
        enabled: true
        state: started

    - name: Generate munge key (only on head node)
      command: dd if=/dev/urandom of=/etc/munge/munge.key bs=1 count=1024
      when: inventory_hostname == "login01"
      args:
        creates: /etc/munge/munge.key

    - name: Set munge key permissions on head
      file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      when: inventory_hostname == "login01"

    - name: Copy munge key to compute nodes
      copy:
        src: /etc/munge/munge.key
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
        remote_src: yes
      delegate_to: login01
      when: inventory_hostname != "login01"

    - name: Ensure munge key permissions on compute nodes
      file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      when: inventory_hostname != "login01"

    - name: Restart munge everywhere
      systemd:
        name: munge
        state: restarted